# Single source of run settings. Every script reads this file.
seed: 42

dataset:
  repo_id: doevent/perfume
  # Pinned Hugging Face commit so every run uses the same files.
  revision: 9d2db452d8f0d649c4bfb0189a2fcc5282028a3c
  csv_file: perfumes.csv
  images_file: images.zip

queries:
  # Catalog items sampled for the augmented query set; each gets one query per level.
  items: 1000
  # Further items removed from the index to test the "not in the catalog" answer.
  held_out_items: 1000

embedding:
  model: ViT-B-32
  pretrained: laion2b_s34b_b79k
  batch_size: 128

classifier:
  test_size: 0.2
  C: 1.0

paths:
  raw_dir: data/raw
  images_dir: data/images
  queries_dir: data/queries
  features_dir: data/features
  reports_dir: reports
